name: CI
on:
  pull_request:
  push:

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        name: Checkout [${{ github.ref_name }}]
        with:
          fetch-depth: 0
      - uses: nrwl/nx-set-shas@v5
        name: Derive appropriate SHAs for base and head for `nx affected` commands
      - uses: actions/setup-node@v7
        with:
          # Match the nodejs24.x runtime in the Forge app manifests.
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx nx format:check
      # package checks that each Forge app bundle includes all its dependencies.
      - run: npx nx affected -t lint test build package --parallel=3
